<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>カードめくりメモリーマスター</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.4);
      --text-color: #f8fafc;
      --fever-color: #f43f5e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 15px;
      overflow-x: hidden;
    }

    header {
      width: 100%;
      max-width: 500px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    h1 {
      font-size: 1.2rem;
      background: linear-gradient(45deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .status-bar {
      display: flex;
      gap: 15px;
      background: rgba(30, 41, 59, 0.7);
      padding: 8px 16px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(5px);
      font-weight: bold;
    }

    .fever-badge {
      display: none;
      background: var(--fever-color);
      color: white;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 0.8rem;
      animation: pulse 0.5s infinite alternate;
    }

    @keyframes pulse {
      from { transform: scale(1); }
      to { transform: scale(1.1); }
    }

    #game-board {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      width: 100%;
      max-width: 450px;
      perspective: 1000px;
    }

    .card {
      aspect-ratio: 3/4;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      cursor: pointer;
    }

    .card.flipped {
      transform: rotateY(180deg);
    }

    .card.matched {
      transform: rotateY(180deg) scale(0.95);
      opacity: 0.4;
      cursor: default;
    }

    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .card-back {
      background: linear-gradient(135deg, #1e293b, #0f172a);
      border: 2px solid var(--accent-color);
    }

    .card-back::after {
      content: '★';
      font-size: 1.5rem;
      color: var(--accent-color);
      opacity: 0.5;
    }

    .card-front {
      transform: rotateY(180deg);
      background-color: #ffffff;
    }

    .card-front img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .controls {
      margin-top: 20px;
      display: flex;
      gap: 10px;
    }

    button {
      background: linear-gradient(45deg, #38bdf8, #6366f1);
      border: none;
      color: white;
      padding: 10px 20px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 20px;
      cursor: pointer;
      box-shadow: 0 4px 15px var(--accent-glow);
      transition: transform 0.2s;
    }

    button:active {
      transform: scale(0.95);
    }

    /* 図鑑モーダル */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(5px);
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    .modal-content {
      background: #1e293b;
      padding: 20px;
      border-radius: 16px;
      max-width: 400px;
      width: 90%;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin: 15px 0;
    }

    .gallery-item {
      aspect-ratio: 1;
      border-radius: 8px;
      overflow: hidden;
      background: #0f172a;
      opacity: 0.3;
      filter: grayscale(100%);
    }

    .gallery-item.unlocked {
      opacity: 1;
      filter: grayscale(0%);
      border: 1px solid var(--accent-color);
    }

    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    canvas#confetti {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      z-index: 99;
    }
  </style>
</head>
<body>

  <canvas id="confetti"></canvas>

  <header>
    <h1>カードメモリー</h1>
    <div class="status-bar">
      <div>SCORE: <span id="score">0</span></div>
      <div>COMBO: <span id="combo">0</span></div>
      <div id="fever" class="fever-badge">FEVER!</div>
    </div>
  </header>

  <div id="game-board"></div>

  <div class="controls">
    <button onclick="initGame()">リセット</button>
    <button onclick="toggleGallery()">図鑑 (<span id="unlocked-count">0</span>/8)</button>
  </div>

  <!-- 図鑑モーダル -->
  <div id="gallery-modal" class="modal">
    <div class="modal-content">
      <h2>キャラクター図鑑</h2>
      <div class="gallery" id="gallery-grid"></div>
      <button onclick="toggleGallery()">閉じる</button>
    </div>
  </div>

  <script>
    // 添付いただいた画像ファイル名（大文字P）
    const imageFiles = [
      './P01.jpg',
      './P02.jpg',
      './P03.jpg',
      './P04.jpg',
      './P05.jpg',
      './P06.jpg',
      './P07.jpg',
      './P08.jpg'
    ];

    let cardsData = [];
    let flippedCards = [];
    let lockBoard = false;
    let score = 0;
    let combo = 0;
    let matchedPairs = 0;
    let unlockedGallery = new Set(JSON.parse(localStorage.getItem('unlockedCards') || '[]'));

    // Web Audio API による効果音生成
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (type === 'flip') {
        osc.frequency.setValueAtTime(400, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
        osc.start(); osc.stop(audioCtx.currentTime + 0.1);
      } else if (type === 'match') {
        osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
        osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1); // E5
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        osc.start(); osc.stop(audioCtx.currentTime + 0.3);
      } else if (type === 'miss') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(200, audioCtx.currentTime);
        osc.frequency.linearRampToValueAtTime(100, audioCtx.currentTime + 0.2);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
        osc.start(); osc.stop(audioCtx.currentTime + 0.2);
      }
    }

    function initGame() {
      const board = document.getElementById('game-board');
      board.innerHTML = '';
      flippedCards = [];
      lockBoard = false;
      score = 0;
      combo = 0;
      matchedPairs = 0;
      updateUI();

      // カードペアを作成してシャッフル
      cardsData = [...imageFiles, ...imageFiles].sort(() => Math.random() - 0.5);

      cardsData.forEach((imgSrc, index) => {
        const card = document.createElement('div');
        card.classList.add('card');
        card.dataset.imgSrc = imgSrc;

        card.innerHTML = `
          <div class="card-face card-back"></div>
          <div class="card-face card-front">
            <img src="${imgSrc}" alt="card" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'100\' height=\'100\' viewBox=\'0 0 100 100\'><rect width=\'100\' height=\'100\' fill=\'%23333\'/><text x=\'50\' y=\'55\' fill=\'%23fff\' font-size=\'12\' text-anchor=\'middle\'>画像読み込み不可</text></svg>'">
          </div>
        `;

        card.addEventListener('click', flipCard);
        board.appendChild(card);
      });

      updateGalleryUI();
    }

    function flipCard() {
      if (lockBoard || this.classList.contains('flipped') || this.classList.contains('matched')) return;

      playSound('flip');
      this.classList.add('flipped');
      flippedCards.push(this);

      if (flippedCards.length === 2) {
        checkMatch();
      }
    }

    function checkMatch() {
      const [card1, card2] = flippedCards;
      const isMatch = card1.dataset.imgSrc === card2.dataset.imgSrc;

      if (isMatch) {
        playSound('match');
        combo++;
        const multiplier = combo >= 3 ? 2 : 1;
        score += 100 * multiplier * combo;
        matchedPairs++;

        card1.classList.add('matched');
        card2.classList.add('matched');

        // 図鑑アンロック保存
        unlockedGallery.add(card1.dataset.imgSrc);
        localStorage.setItem('unlockedCards', JSON.stringify([...unlockedGallery]));
        updateGalleryUI();

        resetTurn();

        if (matchedPairs === imageFiles.length) {
          setTimeout(triggerWin, 500);
        }
      } else {
        playSound('miss');
        combo = 0;
        lockBoard = true;
        setTimeout(() => {
          card1.classList.remove('flipped');
          card2.classList.remove('flipped');
          resetTurn();
        }, 1000);
      }
      updateUI();
    }

    function resetTurn() {
      flippedCards = [];
      lockBoard = false;
    }

    function updateUI() {
      document.getElementById('score').textContent = score;
      document.getElementById('combo').textContent = combo;
      document.getElementById('fever').style.display = combo >= 3 ? 'inline-block' : 'none';
    }

    function updateGalleryUI() {
      document.getElementById('unlocked-count').textContent = unlockedGallery.size;
      const galleryGrid = document.getElementById('gallery-grid');
      galleryGrid.innerHTML = '';

      imageFiles.forEach(imgSrc => {
        const item = document.createElement('div');
        item.classList.add('gallery-item');
        if (unlockedGallery.has(imgSrc)) {
          item.classList.add('unlocked');
        }
        item.innerHTML = `<img src="${imgSrc}" alt="gallery">`;
        galleryGrid.appendChild(item);
      });
    }

    function toggleGallery() {
      const modal = document.getElementById('gallery-modal');
      modal.style.display = modal.style.display === 'flex' ? 'none' : 'flex';
    }

    // 紙吹雪演出
    function triggerWin() {
      const canvas = document.getElementById('confetti');
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const particles = Array.from({ length: 100 }).map(() => ({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height - canvas.height,
        color: `hsl(${Math.random() * 360}, 100%, 50%)`,
        size: Math.random() * 10 + 5,
        speed: Math.random() * 5 + 2
      }));

      function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach(p => {
          p.y += p.speed;
          ctx.fillStyle = p.color;
          ctx.fillRect(p.x, p.y, p.size, p.size);
        });
        if (particles.some(p => p.y < canvas.height)) {
          requestAnimationFrame(render);
        }
      }
      render();
      alert(`ゲームクリア！\n最終スコア: ${score}点`);
    }

    // ゲーム開始
    initGame();
  </script>
</body>
</html>
