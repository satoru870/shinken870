<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ロイヤル・メモリーカード</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Noto+Sans+JP:wght@400;700&display=swap');

    :root {
      --bg-gradient: radial-gradient(circle at center, #1a1c29 0%, #0a0b10 100%);
      --gold-primary: linear-gradient(135deg, #bf953f 0%, #fcf6ba 25%, #b38728 50%, #fbf5b7 75%, #aa771c 100%);
      --gold-border: linear-gradient(135deg, #d4af37, #8a6d3b);
      --card-back: linear-gradient(145deg, #181b26, #0d0e15);
      --glass-panel: rgba(255, 255, 255, 0.03);
      --glass-border: rgba(212, 175, 55, 0.25);
      --text-gold: #e6c670;
      --text-color: #f1f5f9;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      font-family: 'Cinzel', 'Noto Sans JP', serif;
      background: var(--bg-gradient);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 15px;
      overflow-x: hidden;
    }

    header {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      background: var(--gold-primary);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 20px rgba(212, 175, 55, 0.2);
    }

    .status-bar {
      width: 100%;
      display: flex;
      justify-content: space-around;
      align-items: center;
      background: var(--glass-panel);
      padding: 10px 20px;
      border-radius: 30px;
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      font-size: 0.9rem;
      letter-spacing: 0.05em;
    }

    .status-value {
      color: var(--text-gold);
      font-weight: bold;
    }

    .fever-badge {
      display: none;
      background: var(--gold-primary);
      color: #000;
      padding: 2px 10px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: bold;
      animation: goldGlow 0.8s infinite alternate;
    }

    @keyframes goldGlow {
      from { box-shadow: 0 0 5px #d4af37; }
      to { box-shadow: 0 0 15px #fcf6ba; }
    }

    #game-board {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      width: 100%;
      max-width: 450px;
      perspective: 1000px;
      position: relative;
    }

    .card {
      aspect-ratio: 3/4;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
      cursor: pointer;
    }

    .card.flipped {
      transform: rotateY(180deg);
    }

    .card.matched {
      transform: rotateY(180deg) scale(0.92);
      opacity: 0.45;
      cursor: default;
    }

    .card.match-anim {
      animation: royalBounce 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      z-index: 10;
    }

    @keyframes royalBounce {
      0% { transform: rotateY(180deg) scale(1); }
      50% { transform: rotateY(180deg) scale(1.18); box-shadow: 0 0 30px rgba(212, 175, 55, 0.8); }
      100% { transform: rotateY(180deg) scale(0.92); }
    }

    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid var(--glass-border);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.5);
    }

    .card-back {
      background: var(--card-back);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .card-back::before {
      content: '';
      position: absolute;
      inset: 6px;
      border: 1px solid rgba(212, 175, 55, 0.3);
      border-radius: 6px;
    }

    .card-back::after {
      content: '◆';
      font-size: 1.2rem;
      background: var(--gold-primary);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      opacity: 0.7;
    }

    .card-front {
      transform: rotateY(180deg);
      background-color: #000;
    }

    .card-front img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* ポップアップコンボ演出 */
    .combo-text {
      position: absolute;
      font-family: 'Cinzel', serif;
      font-size: 1.8rem;
      font-weight: 700;
      background: var(--gold-primary);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
      pointer-events: none;
      animation: floatUp 0.9s ease-out forwards;
      z-index: 50;
    }

    @keyframes floatUp {
      0% { opacity: 1; transform: translate(-50%, 0) scale(0.6); }
      50% { transform: translate(-50%, -35px) scale(1.2); }
      100% { opacity: 0; transform: translate(-50%, -70px) scale(1); }
    }

    .controls {
      margin-top: 25px;
      display: flex;
      gap: 15px;
    }

    button {
      background: transparent;
      border: 1px solid var(--text-gold);
      color: var(--text-gold);
      padding: 10px 24px;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: bold;
      letter-spacing: 0.1em;
      border-radius: 25px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: all 0.3s;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }

    button:hover {
      background: var(--gold-primary);
      color: #000;
      box-shadow: 0 0 20px rgba(212, 175, 55, 0.4);
    }

    button:active {
      transform: scale(0.96);
    }

    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(5, 6, 10, 0.85);
      backdrop-filter: blur(8px);
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    .modal-content {
      background: #12141d;
      padding: 25px;
      border-radius: 16px;
      max-width: 420px;
      width: 90%;
      text-align: center;
      border: 1px solid var(--glass-border);
      box-shadow: 0 10px 40px rgba(0,0,0,0.8);
    }

    .modal-content h2 {
      color: var(--text-gold);
      margin-bottom: 15px;
      font-size: 1.2rem;
      letter-spacing: 0.1em;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin: 20px 0;
    }

    .gallery-item {
      aspect-ratio: 1;
      border-radius: 8px;
      overflow: hidden;
      background: #000;
      opacity: 0.2;
      filter: grayscale(100%);
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: all 0.4s;
    }

    .gallery-item.unlocked {
      opacity: 1;
      filter: grayscale(0%);
      border: 1px solid var(--text-gold);
      box-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
    }

    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    canvas#fx-canvas {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      z-index: 99;
    }
  </style>
</head>
<body>

  <canvas id="fx-canvas"></canvas>

  <header>
    <h1>ROYAL MEMORY</h1>
    <div class="status-bar">
      <div>SCORE: <span id="score" class="status-value">0</span></div>
      <div>COMBO: <span id="combo" class="status-value">0</span></div>
      <div id="fever" class="fever-badge">FEVER</div>
    </div>
  </header>

  <div id="game-board"></div>

  <div class="controls">
    <button onclick="initGame()">RESET</button>
    <button onclick="toggleGallery()">GALLERY (<span id="unlocked-count">0</span>/8)</button>
  </div>

  <div id="gallery-modal" class="modal">
    <div class="modal-content">
      <h2>COLLECTION</h2>
      <div class="gallery" id="gallery-grid"></div>
      <button onclick="toggleGallery()">CLOSE</button>
    </div>
  </div>

  <script>
    const imageFiles = [
      './P01.jpg',
      './P02.jpg',
      './P03.jpg',
      './P04.jpg',
      './P05.jpg',
      './P06.jpg',
      './P07.jpg',
      './P08.jpg'
    ];

    let cardsData = [];
    let flippedCards = [];
    let lockBoard = false;
    let score = 0;
    let combo = 0;
    let matchedPairs = 0;
    let unlockedGallery = new Set(JSON.parse(localStorage.getItem('unlockedCards') || '[]'));

    // Web Audio API 初期化＆サウンド生成
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    // 最初のユーザー操作（クリック/タップ）でAudioContextを有効化
    window.addEventListener('click', initAudio, { once: true });
    window.addEventListener('touchstart', initAudio, { once: true });

    function playSound(type) {
      initAudio();
      if (!audioCtx) return;

      const now = audioCtx.currentTime;

      if (type === 'flip') {
        // 上質なカードをめくる音
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        
        osc.frequency.setValueAtTime(300, now);
        osc.frequency.exponentialRampToValueAtTime(150, now + 0.08);
        
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
        
        osc.start(now);
        osc.stop(now + 0.08);

      } else if (type === 'match') {
        // 高級感あるキラキラしたハープ風チャイム音
        const freqs = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
        freqs.forEach((f, i) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'triangle';
          osc.connect(gain);
          gain.connect(audioCtx.destination);

          const startTime = now + i * 0.06;
          osc.frequency.setValueAtTime(f, startTime);

          gain.gain.setValueAtTime(0.2, startTime);
          gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.4);

          osc.start(startTime);
          osc.stop(startTime + 0.4);
        });

      } else if (type === 'miss') {
        // 落ち着いた低音のミス音
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.frequency.setValueAtTime(180, now);
        osc.frequency.exponentialRampToValueAtTime(90, now + 0.2);

        gain.gain.setValueAtTime(0.15, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.2);

        osc.start(now);
        osc.stop(now + 0.2);
      }
    }

    // エフェクト用キャンバス設定
    const canvas = document.getElementById('fx-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function initGame() {
      const board = document.getElementById('game-board');
      board.innerHTML = '';
      flippedCards = [];
      lockBoard = false;
      score = 0;
      combo = 0;
      matchedPairs = 0;
      updateUI();

      cardsData = [...imageFiles, ...imageFiles].sort(() => Math.random() - 0.5);

      cardsData.forEach((imgSrc) => {
        const card = document.createElement('div');
        card.classList.add('card');
        card.dataset.imgSrc = imgSrc;

        card.innerHTML = `
          <div class="card-face card-back"></div>
          <div class="card-face card-front">
            <img src="${imgSrc}" alt="card" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'100\' height=\'100\'><rect width=\'100\' height=\'100\' fill=\'%23111\'/></svg>'">
          </div>
        `;

        card.addEventListener('click', flipCard);
        board.appendChild(card);
      });

      updateGalleryUI();
    }

    function flipCard() {
      if (lockBoard || this.classList.contains('flipped') || this.classList.contains('matched')) return;

      playSound('flip');
      this.classList.add('flipped');
      flippedCards.push(this);

      if (flippedCards.length === 2) {
        checkMatch();
      }
    }

    function checkMatch() {
      const [card1, card2] = flippedCards;
      const isMatch = card1.dataset.imgSrc === card2.dataset.imgSrc;

      if (isMatch) {
        playSound('match');
        combo++;
        const multiplier = combo >= 3 ? 2 : 1;
        score += 100 * multiplier * combo;
        matchedPairs++;

        [card1, card2].forEach(card => {
          card.classList.add('match-anim', 'matched');
          createGoldSparkles(card);
        });

        showComboText(card2, combo > 1 ? `${combo} COMBO!` : 'MATCH!');

        unlockedGallery.add(card1.dataset.imgSrc);
        localStorage.setItem('unlockedCards', JSON.stringify([...unlockedGallery]));
        updateGalleryUI();

        resetTurn();

        if (matchedPairs === imageFiles.length) {
          setTimeout(triggerWin, 600);
        }
      } else {
        playSound('miss');
        combo = 0;
        lockBoard = true;
        setTimeout(() => {
          card1.classList.remove('flipped');
          card2.classList.remove('flipped');
          resetTurn();
        }, 900);
      }
      updateUI();
    }

    function resetTurn() {
      flippedCards = [];
      lockBoard = false;
    }

    // ゴールドの粒子エフェクト
    function createGoldSparkles(cardElement) {
      const rect = cardElement.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;

      for (let i = 0; i < 25; i++) {
        particles.push({
          x: centerX,
          y: centerY,
          vx: (Math.random() - 0.5) * 7,
          vy: (Math.random() - 0.5) * 7,
          size: Math.random() * 4 + 2,
          color: `hsl(${Math.random() * 20 + 40}, 100%, 70%)`, // 金色系の色相
          alpha: 1,
          life: 0.025
        });
      }
    }

    function showComboText(cardElement, text) {
      const rect = cardElement.getBoundingClientRect();
      const textEl = document.createElement('div');
      textEl.className = 'combo-text';
      textEl.textContent = text;
      textEl.style.left = `${rect.left + rect.width / 2}px`;
      textEl.style.top = `${rect.top}px`;
      document.body.appendChild(textEl);
      setTimeout(() => textEl.remove(), 900);
    }

    function renderParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach((p, index) => {
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= p.life;

        ctx.save();
        ctx.globalAlpha = Math.max(0, p.alpha);
        ctx.fillStyle = p.color;
        ctx.shadowBlur = 8;
        ctx.shadowColor = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        if (p.alpha <= 0) particles.splice(index, 1);
      });
      requestAnimationFrame(renderParticles);
    }
    renderParticles();

    function updateUI() {
      document.getElementById('score').textContent = score;
      document.getElementById('combo').textContent = combo;
      document.getElementById('fever').style.display = combo >= 3 ? 'inline-block' : 'none';
    }

    function updateGalleryUI() {
      document.getElementById('unlocked-count').textContent = unlockedGallery.size;
      const galleryGrid = document.getElementById('gallery-grid');
      galleryGrid.innerHTML = '';

      imageFiles.forEach(imgSrc => {
        const item = document.createElement('div');
        item.classList.add('gallery-item');
        if (unlockedGallery.has(imgSrc)) {
          item.classList.add('unlocked');
        }
        item.innerHTML = `<img src="${imgSrc}" alt="gallery">`;
        galleryGrid.appendChild(item);
      });
    }

    function toggleGallery() {
      initAudio();
      const modal = document.getElementById('gallery-modal');
      modal.style.display = modal.style.display === 'flex' ? 'none' : 'flex';
    }

    function triggerWin() {
      for (let i = 0; i < 120; i++) {
        particles.push({
          x: Math.random() * canvas.width,
          y: canvas.height + 10,
          vx: (Math.random() - 0.5) * 8,
          vy: -Math.random() * 12 - 6,
          size: Math.random() * 5 + 3,
          color: `hsl(${Math.random() * 30 + 35}, 100%, 65%)`,
          alpha: 1,
          life: 0.012
        });
      }
      setTimeout(() => {
        alert(`CONGRATULATIONS!\nFINAL SCORE: ${score}`);
      }, 600);
    }

    initGame();
  </script>
</body>
</html>
